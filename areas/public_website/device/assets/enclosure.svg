<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" fill="none">
  <title>Local Voice — compact aluminum enclosure concept</title>
  <desc>A softly rounded, low-profile silver enclosure with a flush circular listening button, a tiny microphone aperture, and a discreet perforated acoustic band near its base. This is an illustrative form study, not a fit-validated mechanical design.</desc>
  <defs>
    <linearGradient id="aluminum-top" x1="14%" y1="0%" x2="86%" y2="100%">
      <stop stop-color="#fcfcfb"/>
      <stop offset=".43" stop-color="#f0f1f1"/>
      <stop offset="1" stop-color="#d8dadd"/>
    </linearGradient>
    <linearGradient id="aluminum-wall" gradientUnits="userSpaceOnUse" x1="135" y1="270" x2="518" y2="270">
      <stop stop-color="#b1b6bc"/>
      <stop offset=".12" stop-color="#d9dddf"/>
      <stop offset=".42" stop-color="#e7e9ea"/>
      <stop offset=".52" stop-color="#cbd0d4"/>
      <stop offset=".64" stop-color="#aeb5bc"/>
      <stop offset=".87" stop-color="#cbd1d6"/>
      <stop offset="1" stop-color="#e3e7e9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop stop-color="#fffefd"/>
      <stop offset="1" stop-color="#c0c6cb"/>
    </linearGradient>
    <radialGradient id="button-well">
      <stop offset=".68" stop-color="#e7e9ea"/>
      <stop offset=".9" stop-color="#dce1e4"/>
      <stop offset="1" stop-color="#bac4cc"/>
    </radialGradient>
    <linearGradient id="button-face" x1="0%" y1="0%" x2="75%" y2="100%">
      <stop stop-color="#f9faf9"/>
      <stop offset="1" stop-color="#dfe4e7"/>
    </linearGradient>
    <radialGradient id="indicator">
      <stop stop-color="#fff7df"/>
      <stop offset=".4" stop-color="#f5edcf"/>
      <stop offset="1" stop-color="#d8ca9f"/>
    </radialGradient>
    <pattern id="micro-perforation" width="4" height="3.6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".62" fill="#667077" fill-opacity=".58"/>
      <circle cx="3" cy="2.8" r=".62" fill="#667077" fill-opacity=".58"/>
    </pattern>
    <radialGradient id="contact-shadow">
      <stop stop-color="#3f4449" stop-opacity=".18"/>
      <stop offset="1" stop-color="#3f4449" stop-opacity="0"/>
    </radialGradient>
  </defs>
